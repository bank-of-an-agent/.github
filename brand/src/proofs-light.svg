<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-label="Private proofs: Agent Bank attests facts and anchors a root on Base; the agent proves a statement in zero knowledge; the verifier learns the statement, never who the agent is">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF3FF"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C93C9"/></marker></defs>
<rect width="1040" height="400" rx="20" fill="url(#bg)"/>
<g font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="36" y="52" font-size="12" font-weight="600" letter-spacing="2" fill="#5B6B92">AGENT BANK · OFF-CHAIN</text>
<text x="390" y="52" font-size="12" font-weight="600" letter-spacing="2" fill="#5B6B92">BASE · ON-CHAIN</text>
<text x="744" y="52" font-size="12" font-weight="600" letter-spacing="2" fill="#5B6B92">VERIFIER</text>
<rect x="36" y="96" width="260" height="150" rx="12" fill="#EEF3FF" stroke="#9DB4F2"/>
<text x="56" y="128" font-size="16" font-weight="600" fill="#0B1222">Agent Bank attests</text>
<text x="56" y="154" font-size="12.5" fill="#5B6680">13 facts per agent: KYB status,</text>
<text x="56" y="174" font-size="12.5" fill="#5B6680">limits, balance, reservations,</text>
<text x="56" y="194" font-size="12.5" fill="#5B6680">track record</text>
<text x="56" y="222" font-size="12.5" fill="#0B1222">hashed into a Merkle tree</text>
<rect x="390" y="70" width="260" height="92" rx="12" fill="#EEF3FF" stroke="#9DB4F2"/>
<text x="410" y="102" font-size="16" font-weight="600" fill="#0B1222">Registry on Base</text>
<text x="410" y="126" font-size="12.5" fill="#5B6680">one public root per snapshot</text>
<text x="410" y="146" font-size="12.5" fill="#5B6680">revocable · facts stay hidden</text>
<text x="390" y="196" font-size="12" font-weight="600" letter-spacing="2" fill="#5B6B92">AGENT RUNTIME</text>
<rect x="390" y="208" width="260" height="92" rx="12" fill="#ECFDF9" stroke="#5EEAD4"/>
<text x="410" y="240" font-size="16" font-weight="600" fill="#0B1222">Agent proves</text>
<text x="410" y="264" font-size="12.5" fill="#5B6680">zero-knowledge proof, about 1.5 s</text>
<text x="410" y="284" font-size="12.5" fill="#5B6680">with a secret only it holds</text>
<rect x="744" y="70" width="260" height="230" rx="12" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="764" y="102" font-size="16" font-weight="600" fill="#0B1222">Verifier learns</text>
<text x="764" y="124" font-size="12.5" fill="#5B6680">a statement, checked in ~15 ms</text>
<circle cx="772" cy="154" r="8" fill="none" stroke="#0D9488" stroke-width="1.4"/><path d="M768 154 l3 3 l6 -6" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="158" font-size="12.5" fill="#0B1222">a verified company backs it</text>
<circle cx="772" cy="182" r="8" fill="none" stroke="#0D9488" stroke-width="1.4"/><path d="M768 182 l3 3 l6 -6" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="186" font-size="12.5" fill="#0B1222">it can pay $5 per call</text>
<circle cx="772" cy="210" r="8" fill="none" stroke="#0D9488" stroke-width="1.4"/><path d="M768 210 l3 3 l6 -6" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="214" font-size="12.5" fill="#0B1222">$500 is reserved for me</text>
<circle cx="772" cy="238" r="8" fill="none" stroke="#0D9488" stroke-width="1.4"/><path d="M768 238 l3 3 l6 -6" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="242" font-size="12.5" fill="#0B1222">no lost disputes</text>
<circle cx="772" cy="274" r="8" fill="none" stroke="#B4BCD0" stroke-width="1.4"/><path d="M768.5 270.5 l7 7 M775.5 270.5 l-7 7" fill="none" stroke="#B4BCD0" stroke-width="2" stroke-linecap="round"/>
<text x="788" y="278" font-size="12.5" fill="#5B6680">never who it is, or how much</text>
<path d="M296 140 C 340 140, 345 116, 386 116" fill="none" stroke="#7C93C9" stroke-width="1.6" marker-end="url(#a)"/><text x="341" y="100" font-size="11.5" fill="#5B6680" text-anchor="middle">publishes root</text>
<path d="M296 210 C 340 210, 345 254, 386 254" fill="none" stroke="#7C93C9" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="262" font-size="11.5" fill="#5B6680" text-anchor="middle">witness</text>
<path d="M650 254 L 740 254" fill="none" stroke="#7C93C9" stroke-width="1.6" marker-end="url(#a)"/><text x="695" y="246" font-size="11.5" fill="#5B6680" text-anchor="middle">proof</text>
<path d="M744 116 L 654 116" fill="none" stroke="#7C93C9" stroke-width="1.6" marker-end="url(#a)"/><text x="699" y="108" font-size="11.5" fill="#5B6680" text-anchor="middle">checks root</text>
<rect x="36" y="318" width="310" height="58" rx="12" fill="#FFFFFF" stroke="#D3DCEE"/><circle cx="58" cy="347" r="5" fill="#2F5BEA"/><text x="74" y="342" font-size="14" font-weight="600" fill="#0B1222">Agent credentials</text><text x="74" y="361" font-size="12" fill="#5B6680">a verified backer and spending limits</text>
<rect x="363" y="318" width="310" height="58" rx="12" fill="#FFFFFF" stroke="#D3DCEE"/><circle cx="385" cy="347" r="5" fill="#2F5BEA"/><text x="401" y="342" font-size="14" font-weight="600" fill="#0B1222">Private reputation</text><text x="401" y="361" font-size="12" fill="#5B6680">a track record without an identity</text>
<rect x="690" y="318" width="310" height="58" rx="12" fill="#FFFFFF" stroke="#D3DCEE"/><circle cx="712" cy="347" r="5" fill="#2F5BEA"/><text x="728" y="342" font-size="14" font-weight="600" fill="#0B1222">Proof of funds</text><text x="728" y="361" font-size="12" fill="#5B6680">money reserved for one verifier</text>
</g></svg>
