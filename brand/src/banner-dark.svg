<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Agent Bank: programmable, non-custodial bank accounts for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0E1834"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#4C7DFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C7DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.6" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3F6FC"/>
      <stop offset="1" stop-color="#C7D6FF"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glowL)"/>
  <rect width="1280" height="440" fill="url(#glowR)"/>

  <!-- mark -->
  <g transform="translate(72 64) scale(0.1875)">
    <rect width="512" height="512" rx="116" fill="#0D1630"/>
    <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="6"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30"/>
    <circle cx="256" cy="236" r="40" fill="#EEF2FA"/>
    <path d="M236 262 H276 L290 322 Q292 332 282 332 H230 Q220 332 222 322 Z" fill="#EEF2FA"/>
    <circle cx="256" cy="106" r="27" fill="#F5B947" stroke="#0A1022" stroke-width="10"/>
    <circle cx="385.9" cy="331" r="27" fill="#2DD4BF" stroke="#0A1022" stroke-width="10"/>
    <circle cx="126.1" cy="331" r="27" fill="#A78BFA" stroke="#0A1022" stroke-width="10"/>
  </g>

  <!-- copy -->
  <g font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="74" y="200" font-size="15" font-weight="600" letter-spacing="4" fill="#8FA0C6">BANK OF AN AGENT</text>
    <text x="70" y="268" font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Agent Bank</text>
    <text x="74" y="312" font-size="22" font-weight="400" fill="#AEB9D3">Programmable, non-custodial bank accounts for AI agents.</text>

    <g font-size="14" font-weight="500" fill="#CAD4EA">
      <rect x="72" y="342" width="132" height="34" rx="17" fill="#101B36" stroke="#26375F"/>
      <circle cx="92" cy="359" r="5" fill="#5B8CFF"/>
      <text x="104" y="364">USDC on Base</text>
      <rect x="214" y="342" width="190" height="34" rx="17" fill="#101B36" stroke="#26375F"/>
      <circle cx="234" cy="359" r="5" fill="#2DD4BF"/>
      <text x="246" y="364">x402 · AP2 · ERC-7579</text>
      <rect x="414" y="342" width="178" height="34" rx="17" fill="#101B36" stroke="#26375F"/>
      <circle cx="434" cy="359" r="5" fill="#F5B947"/>
      <text x="446" y="364">Limits live in code</text>
    </g>
  </g>

  <!-- key diagram -->
  <g font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g filter="url(#soft)">
      <rect x="716" y="70" width="312" height="72" rx="14" fill="#0F1A35" stroke="#263A66"/>
      <rect x="716" y="168" width="312" height="72" rx="14" fill="#0F1A35" stroke="#263A66"/>
      <rect x="716" y="266" width="312" height="72" rx="14" fill="#0F1A35" stroke="#263A66"/>
    </g>
    <circle cx="746" cy="106" r="9" fill="#F5B947"/>
    <text x="768" y="100" font-size="17" font-weight="600" fill="#F1F4FB">Owner key</text>
    <text x="768" y="124" font-size="14" fill="#93A1C2">Held by you · can always exit</text>
    <circle cx="746" cy="204" r="9" fill="#2DD4BF"/>
    <text x="768" y="198" font-size="17" font-weight="600" fill="#F1F4FB">Session key</text>
    <text x="768" y="222" font-size="14" fill="#93A1C2">Held by the agent · scoped, 24h</text>
    <circle cx="746" cy="302" r="9" fill="#A78BFA"/>
    <text x="768" y="296" font-size="17" font-weight="600" fill="#F1F4FB">Co-signer</text>
    <text x="768" y="320" font-size="14" fill="#93A1C2">Agent Bank · can refuse, never move</text>

    <path d="M1028 106 C1062 106 1062 184 1090 196" fill="none" stroke="#F5B947" stroke-opacity="0.75" stroke-width="2.5"/>
    <path d="M1028 204 L1090 204" fill="none" stroke="#2DD4BF" stroke-opacity="0.85" stroke-width="2.5"/>
    <path d="M1028 302 C1062 302 1062 224 1090 212" fill="none" stroke="#A78BFA" stroke-opacity="0.85" stroke-width="2.5"/>

    <g filter="url(#soft)">
      <rect x="1090" y="150" width="138" height="108" rx="16" fill="#122247" stroke="url(#ring)" stroke-width="2"/>
    </g>
    <path d="M1159 168 l18 7 v13 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-13 z" fill="none" stroke="#C9D6F5" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M1151 189 l6 6 l11 -12" fill="none" stroke="#2DD4BF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1159" y="234" font-size="15" font-weight="600" fill="#F1F4FB" text-anchor="middle">Smart account</text>
    <text x="1159" y="250" font-size="12" fill="#93A1C2" text-anchor="middle">Safe · ERC-7579</text>

    <text x="972" y="378" font-size="13.5" fill="#7F8DB0" text-anchor="middle" font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', ui-monospace, monospace">valid = owner  ∨  (session ∧ co-signer ∧ policy)</text>
  </g>
</svg>
